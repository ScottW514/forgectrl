name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libulfius-dev libjpeg-dev zlib1g-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-Werror
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: machine_is_idle fail-closed (X-2)
        run: ./build/status_idle_test
      - name: Machine status JSON sys block
        run: ./build/status_sys_test
      - name: Log-export sanitizer
        run: ./build/sanitize_test
      - name: Raw-frame narrowing and Bayer phase
        run: ./build/debayer_test
      - name: Camera privacy gate fails closed
        run: ./build/lid_gate_test
      - name: Capture frame-health ladder
        run: ./build/camhealth_test
      - name: Gate settings table
        run: ./build/cool_gate_test
      - name: Airflow gate
        run: ./build/airflow_test
      - name: Cooling status document
        run: ./build/coolfmt_test
      - name: Loopback peer check
        run: ./build/auth_peer_test
      - name: Fragmented-MP4 muxer
        run: ./build/mp4mux_test
